name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Both plugins are plain ESM/JS with no build step: syntax checking works
      # on any OS, including the macOS-only Host halves.
      - name: Syntax check (node --check)
        run: |
          set -euo pipefail
          files=(
            disk-doctor/index.js
            disk-doctor/client.js
            disk-doctor/lib/*.js
            disk-doctor/tests/*.js
            neon-5cms-theme/index.js
            neon-5cms-theme/client.js
            neon-5cms-theme/tests/*.js
            .tools/harness-host.mjs
          )
          for file in "${files[@]}"; do
            node --check "$file"
            echo "syntax ok: $file"
          done

      # Offline tests: no df/diskutil/osascript and no browser/DOM is touched,
      # so both suites run on Linux runners.
      - name: Unit tests (offline fixtures and contracts)
        run: |
          node disk-doctor/tests/collector.test.js
          node neon-5cms-theme/tests/contract.test.js

      - name: Validate package manifests
        run: |
          node -e '
            const fs = require("fs");
            const expected = {
              "disk-doctor": "@local/disk-doctor",
              "neon-5cms-theme": "@local/neon-5cms-theme",
            };
            for (const [dir, name] of Object.entries(expected)) {
              const manifest = JSON.parse(fs.readFileSync(dir + "/package.json", "utf8"));
              if (manifest.name !== name) throw new Error("unexpected package name: " + manifest.name);
              if (!manifest.dsh || !manifest.dsh.bundle) throw new Error("missing dsh.bundle in " + dir);
              if (manifest.dsh.client && manifest.dsh.client.platform !== "web") throw new Error("unexpected client platform in " + dir);
              for (const local of ["index.js", "cordis.patch.yml"]) {
                if (!fs.existsSync(dir + "/" + local)) throw new Error("missing " + local + " in " + dir);
              }
              console.log("manifest ok:", manifest.name, manifest.version);
            }
          '
